name: Build iOS Ad Hoc

# 手动触发（Actions 页 → Run workflow）；或推送 ios/ 开头的 tag 触发
on:
  workflow_dispatch:
  push:
    tags:
      - 'ios/*'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Capacitor sync iOS (含 pod install)
        run: npx cap sync ios

      - name: Force iOS bundle identifier (com.kuaimai.official)
        run: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.kuaimai.app;/PRODUCT_BUNDLE_IDENTIFIER = com.kuaimai.official;/g" ios/App/App.xcodeproj/project.pbxproj
          echo "official count:"; grep -c "com.kuaimai.official" ios/App/App.xcodeproj/project.pbxproj

      - name: Decode & install provisioning profile
        id: profile
        env:
          PP_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$PP_BASE64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PP_DIR/$UUID.mobileprovision"
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Provisioning profile: name=$NAME uuid=$UUID"

      - name: Decode & import distribution certificate
        env:
          CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "ci_temp_pw" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "ci_temp_pw" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "ci_temp_pw" "$KEYCHAIN"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PP_NAME: ${{ steps.profile.outputs.name }}
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PP_NAME" \
            archive

      - name: Export Ad Hoc IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PP_NAME: ${{ steps.profile.outputs.name }}
        run: |
          cp ios-ci/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          sed -i '' "s/__TEAMID__/$TEAM_ID/g; s/__PPNAME__/$PP_NAME/g" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIkuaimai-AdHoc-IPA
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 21
