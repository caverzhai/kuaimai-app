<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="/favicon.svg">
  <title>快卖</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
    #splash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-logo {
      width: 100px;
      height: 100px;
      background: white;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: bold;
      color: #f97316;
      margin-bottom: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .splash-title {
      color: white;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
      letter-spacing: 4px;
    }
    .splash-subtitle {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      margin-bottom: 40px;
    }
    .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    try {
      window.__platform__ = JSON.parse('{{{__platform__}}}');
    } catch (e) {
      console.error('Failed to parse __platform__', e);
    }
  </script>
</head>

<body>
  <div id="splash">
    <div class="splash-logo">快</div>
    <div class="splash-title">快卖</div>
    <div class="splash-subtitle">让天下再没有不好卖的产品</div>
    <div class="splash-spinner"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
  <script>
    // React加载完成后隐藏启动页
    window.addEventListener('load', function() {
      setTimeout(function() {
        var splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function() { splash.remove(); }, 300);
        }
      }, 500);
    });
  </script>
</body>

</html>
